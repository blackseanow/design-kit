{% extends "design_kit/auth_layout.html" %}
{% from "design_kit/macros.html" import password_field %}
{% block content %}
<h2>登录</h2>
<form class="login-form" method="post" action="{{ url_for('login') }}">
  <label for="username"><span>用户名</span><input id="username" name="username" autocomplete="username" required value="demo"></label>
  {{ password_field("password", "密码") }}
  <button type="submit">登录</button>
  <p class="login-secondary-link">演示页面：不会校验或保存任何凭证。</p>
</form>
{% endblock %}
