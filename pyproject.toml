[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "design-kit"
version = "1.2.0"
description = "Console design system for Flask + Jinja: tokens, CSS, JS components and macros"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0"]

[tool.setuptools]
packages = ["design_kit"]

[tool.setuptools.package-data]
design_kit = ["static/*.css", "static/*.js", "static/icons.svg", "static/icons/*", "templates/design_kit/*.html"]
